# Dependabot configuration for ToolSandbox
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Ecosystems tracked:
#   - nuget          → DFSCleanup solution (DfsTargetCleanup + tests)
#   - github-actions → any workflows added under .github/workflows/
#
# WingetUpdater (when present) is intentionally NOT tracked — it is expected to have no external Python dependencies.
# It should use only the Python standard library (argparse, json, logging, os, html, re,
# smtplib, subprocess, sys, datetime, email.mime.*, pathlib) and ship no requirements.txt,
# pyproject.toml, setup.py, or Pipfile, so Dependabot's `pip` ecosystem has nothing to read.
# Its sole external dependency is the `winget` CLI itself (a Windows system tool that
# Dependabot cannot manage).
#
# If a future change adds a third-party Python dependency, create the appropriate manifest
# under /WingetUpdater and add a `pip` ecosystem block here mirroring the `nuget` block
# below (weekly Monday schedule, grouped minor/patch + separate security group, labels:
# dependencies + pip, commit-message prefix "deps(pip)").
# If this guidance is duplicated elsewhere (docs/skills), keep the rationale in sync.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # .NET / NuGet packages for the DFSCleanup solution
  #
  # Scanned via PackageReference elements in:
  #   - DFSCleanup/DfsTargetCleanup/DfsTargetCleanup.csproj
  #       Runtime:   Microsoft.PowerShell.SDK, System.CommandLine
  #   - DFSCleanup/DfsTargetCleanup.Tests/DfsTargetCleanup.Tests.csproj
  #       Test:      coverlet.collector, Microsoft.NET.Test.Sdk, Moq, xunit,
  #                  xunit.runner.visualstudio
  #
  # No NuGet.config exists in this repo and none is required. Dependabot's nuget
  # ecosystem reads <PackageReference> directly from .csproj/.sln files and uses
  # the default nuget.org feed. A NuGet.config would only be needed if/when this
  # solution starts consuming a private/internal feed or needs to override
  # package source mappings; in that case, add NuGet.config alongside the .sln
  # and configure Dependabot registries/credentials as needed for any authenticated feeds.
  # ---------------------------------------------------------------------------
  - package-ecosystem: nuget
    directory: /DFSCleanup
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(nuget)"
    labels:
      - dependencies
      - nuget
    groups:
      # Roll up low-risk updates into a single PR per week to keep noise down.
      nuget-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Security fixes always grouped together for fast review.
      nuget-security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
          - major
    # Majors get their own PRs (left ungrouped) so breaking changes are reviewed
    # on their own merits rather than buried in a multi-package bump.

  # ---------------------------------------------------------------------------
  # GitHub Actions used by any workflows under .github/workflows/
  # No workflows exist today; this is a no-op until one is added, at which
  # point Dependabot will start tracking the action versions automatically.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
          - major
