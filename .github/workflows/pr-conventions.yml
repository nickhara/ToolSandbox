# Validates PR titles against Conventional Commits and enforces branch naming.
#
# PR title: squash-merge promotes it verbatim to main, so a valid title is
# required (blocking).
# Branch name: must match ^(feat|fix|...)/[a-z0-9._/-]+$; the job fails if
# it doesn't (blocking).
#
# See CONTRIBUTING.md.

name: pr-conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  pr-conventions-check:
    name: pr-conventions-check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject of the PR title must start with a lowercase letter.
            Example: "feat(winget-updater): add --exclude flag"

      - name: Validate branch-name prefix (blocking)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)/[a-z0-9._/-]+$'
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Branch '$BRANCH' doesn't match the required pattern '$PATTERN'. See CONTRIBUTING.md."
            exit 1
          else
            echo "Branch '$BRANCH' matches the required prefix pattern."
          fi
