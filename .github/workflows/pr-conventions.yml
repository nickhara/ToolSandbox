# Validates PR titles against Conventional Commits.
#
# Why only the title? Squash-merge promotes the PR title verbatim to the
# commit message on main, so a valid title is the one thing that actually
# affects repo history. Branch names are ephemeral under squash-merge — we
# emit a notice if a branch name doesn't match the recommended prefixes,
# but we do not fail the check.
#
# See CONTRIBUTING.md.

name: pr-conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  pr-conventions-check:
    name: pr-conventions-check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject of the PR title must start with a lowercase letter.
            Example: "feat(winget-updater): add --exclude flag"

      - name: Suggest branch-name prefix (non-blocking)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)/[a-z0-9._/-]+$'
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::notice::Branch '$BRANCH' doesn't start with a recommended type prefix (feat/, fix/, chore/, ...). This is a suggestion, not a failure. See CONTRIBUTING.md."
          else
            echo "Branch '$BRANCH' uses a recommended prefix."
          fi
